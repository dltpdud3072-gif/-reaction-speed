<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant 360 Range Sim</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .hud-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .hud-item {
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid #ff4655;
            color: #fff;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 0 4px 4px 0;
            backdrop-filter: blur(4px);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffcc;
        }
        #crosshair::before { top: 4px; left: -2px; width: 14px; height: 2px; }
        #crosshair::after { top: -2px; left: 4px; width: 2px; height: 14px; }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 29, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .menu-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .menu-title {
            font-size: 48px;
            font-weight: 900;
            color: #ff4655;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,70,85,0.4);
        }
        .menu-box {
            background: #1f2326;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 8px;
            width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .setting-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .setting-group label {
            display: block;
            font-size: 14px;
            color: #a4a7ab;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #ff4655;
        }
        input[type="number"] {
            width: 60px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
        }
        .btn-start {
            background: #ff4655;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            transition: background 0.2s;
            border-radius: 4px;
        }
        .btn-start:hover {
            background: #e03e4b;
        }
        #hit-notifier {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4655;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="hud-panel">
            <div class="hud-item" id="hud-time">시간: 60s</div>
            <div class="hud-item" id="hud-score">점수: 0</div>
            <div class="hud-item" id="hud-hp">체력: 100</div>
        </div>
        <div id="crosshair"></div>
        <div id="hit-notifier">HEADSHOT!</div>
    </div>
    <div id="start-screen" class="menu-screen">
        <div class="menu-title">360° 사격장 훈련원</div>
        <div class="menu-box" style="pointer-events: auto;">
            <div class="setting-group">
                <label>마우스 감도 (발로란트 1600 DPI 기준)</label>
                <div class="control-row">
                    <input type="range" id="sens-slider" min="0.01" max="1.5" step="0.01" value="0.1">
                    <input type="number" id="sens-input" min="0.01" max="1.5" step="0.01" value="0.1">
                </div>
            </div>
            <button class="btn-start" id="btn-play">훈련 시작</button>
        </div>
    </div>
    <div id="gameover-screen" class="menu-screen hidden">
        <div class="menu-title">훈련 종료</div>
        <div class="menu-box" style="pointer-events: auto;">
            <h2 style="margin-top:0; color:#fff;" id="final-score">최종 점수: 0</h2>
            <button class="btn-start" id="btn-retry">다시 도전</button>
        </div>
    </div>
    <script>
        let scene, camera, renderer;
        let isPlaying = false;
        let score = 0;
        let hp = 100;
        let timeLeft = 60;
        let gameTimer = null;
        const VALORANT_YAW = 0.07 * (Math.PI / 180); 
        let currentSens = 0.1;
        let cameraPitch = 0;
        let cameraYaw = 0;
        let bots = [];
        let particles = [];
        const activeLasers = [];
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const sensSlider = document.getElementById('sens-slider');
        const sensInput = document.getElementById('sens-input');
        const hitNotifier = document.getElementById('hit-notifier');
        
        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);
            createEnvironment();
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onStageClick);
            setupSensitivityControls();
        }
        function setupSensitivityControls() {
            sensSlider.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                sensInput.value = val;
                currentSens = val;
            });
            sensInput.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                if(isNaN(val) || val < 0.01) val = 0.01;
                if(val > 1.5) val = 1.5;
                sensSlider.value = val;
                currentSens = val;
            });
        }
        function createEnvironment() {
            const floorGeo = new THREE.CylinderGeometry(30, 30, 1, 64);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            const ringGeo = new THREE.RingGeometry(29.8, 30, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff4655, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.02;
            scene.add(ring);
            for(let r=10; r<=20; r+=5) {
                const innerRingGeo = new THREE.RingGeometry(r - 0.1, r, 64);
                const innerRingMat = new THREE.MeshBasicMaterial({ color: 0x475569, side: THREE.DoubleSide });
                const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
                innerRing.rotation.x = Math.PI / 2;
                innerRing.position.y = 0.01;
                scene.add(innerRing);
            }
        }
        function spawnHumanoidBot() {
            const botGroup = new THREE.Group();
