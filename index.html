<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant 360 Range Sim</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .hud-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .hud-item {
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid #ff4655;
            color: #fff;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 0 4px 4px 0;
            backdrop-filter: blur(4px);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffcc;
        }
        #crosshair::before { top: 4px; left: -2px; width: 14px; height: 2px; }
        #crosshair::after { top: -2px; left: 4px; width: 2px; height: 14px; }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 29, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .menu-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .menu-title {
            font-size: 48px;
            font-weight: 900;
            color: #ff4655;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,70,85,0.4);
        }
        .menu-box {
            background: #1f2326;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 8px;
            width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .setting-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .setting-group label {
            display: block;
            font-size: 14px;
            color: #a4a7ab;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #ff4655;
        }
        input[type="number"] {
            width: 60px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
        }
        .btn-start {
            background: #ff4655;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            transition: background 0.2s;
            border-radius: 4px;
        }
        .btn-start:hover {
            background: #e03e4b;
        }
        #hit-notifier {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4655;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="hud-panel">
            <div class="hud-item" id="hud-time">시간: 60s</div>
            <div class="hud-item" id="hud-score">점수: 0</div>
            <div class="hud-item" id="hud-hp">체력: 100</div>
        </div>
        <div id="crosshair"></div>
        <div id="hit-notifier">HEADSHOT!</div>
    </div>
    <div id="start-screen" class="menu-screen">
        <div class="menu-title">360° 사격장 훈련원</div>
        <div class="menu-box" style="pointer-events: auto;">
            <div class="setting-group">
                <label>마우스 감도 (발로란트 1600 DPI 기준)</label>
                <div class="control-row">
                    <input type="range" id="sens-slider" min="0.01" max="1.5" step="0.01" value="0.1">
                    <input type="number" id="sens-input" min="0.01" max="1.5" step="0.01" value="0.1">
                </div>
            </div>
            <button class="btn-start" id="btn-play">훈련 시작</button>
        </div>
    </div>
    <div id="gameover-screen" class="menu-screen hidden">
        <div class="menu-title">훈련 종료</div>
        <div class="menu-box" style="pointer-events: auto;">
            <h2 style="margin-top:0; color:#fff;" id="final-score">최종 점수: 0</h2>
            <button class="btn-start" id="btn-retry">다시 도전</button>
        </div>
    </div>
    <script>
        let scene, camera, renderer;
        let isPlaying = false;
        let score = 0;
        let hp = 100;
        let timeLeft = 60;
        let gameTimer = null;
        const VALORANT_YAW = 0.07 * (Math.PI / 180); 
        let currentSens = 0.1;
        let cameraPitch = 0;
        let cameraYaw = 0;
        let bots = [];
        let particles = [];
        const activeLasers = [];
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const sensSlider = document.getElementById('sens-slider');
        const sensInput = document.getElementById('sens-input');
        const hitNotifier = document.getElementById('hit-notifier');
        
        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);
            createEnvironment();
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onStageClick);
            setupSensitivityControls();
        }
        function setupSensitivityControls() {
            sensSlider.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                sensInput.value = val;
                currentSens = val;
            });
            sensInput.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                if(isNaN(val) || val < 0.01) val = 0.01;
                if(val > 1.5) val = 1.5;
                sensSlider.value = val;
                currentSens = val;
            });
        }
        function createEnvironment() {
            const floorGeo = new THREE.CylinderGeometry(30, 30, 1, 64);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);
            const ringGeo = new THREE.RingGeometry(29.8, 30, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff4655, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.02;
            scene.add(ring);
            for(let r=10; r<=20; r+=5) {
                const innerRingGeo = new THREE.RingGeometry(r - 0.1, r, 64);
                const innerRingMat = new THREE.MeshBasicMaterial({ color: 0x475569, side: THREE.DoubleSide });
                const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
                innerRing.rotation.x = Math.PI / 2;
                innerRing.position.y = 0.01;
                scene.add(innerRing);
            }
        }
        function spawnHumanoidBot() {
            const botGroup = new THREE.Group();
const armorMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4 });
const pointMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
const jointMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8 });
const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
const head = new THREE.Mesh(headGeo, pointMat);
head.position.y = 1.6;
head.name = "head";
botGroup.add(head);
const neckGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1);
const neck = new THREE.Mesh(neckGeo, jointMat);
neck.position.y = 1.45;
botGroup.add(neck);
const chestGeo = new THREE.CylinderGeometry(0.3, 0.2, 0.6, 8);
const chest = new THREE.Mesh(chestGeo, armorMat);
chest.position.y = 1.1;
chest.name = "body";
botGroup.add(chest);
const legsGeo = new THREE.CylinderGeometry(0.18, 0.12, 0.8, 8);
const legs = new THREE.Mesh(legsGeo, jointMat);
legs.position.y = 0.4;
legs.name = "body";
botGroup.add(legs);
const angle = Math.random() * Math.PI * 2;
const distance = 8 + Math.random() * 14;
botGroup.position.x = Math.cos(angle) * distance;
botGroup.position.z = Math.sin(angle) * distance;
botGroup.position.y = 0;
botGroup.lookAt(0, 1.0, 0);
botGroup.userData = { hp: 1, speed: 1.2 + (Math.random() * 1.5), isDead: false };
scene.add(botGroup);
bots.push(botGroup);
}
function onMouseMove(e) {
if (!isPlaying || document.pointerLockElement !== document.body) return;
cameraYaw -= e.movementX * VALORANT_YAW * currentSens;
cameraPitch -= e.movementY * VALORANT_YAW * currentSens;
cameraPitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, cameraPitch));
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
euler.x = cameraPitch;
euler.y = cameraYaw;
camera.quaternion.setFromEuler(euler);
}
function onStageClick(e) {
if (!isPlaying) return;
if (document.pointerLockElement !== document.body) {
document.body.requestPointerLock();
return;
}
const raycaster = new THREE.Raycaster();
raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
const allTargets = [];
bots.forEach(b => { if(!b.userData.isDead) { allTargets.push(...b.children); } });
const intersects = raycaster.intersectObjects(allTargets);
createLaserTracer(raycaster.ray.direction);
if (intersects.length > 0) {
const hitObject = intersects.object;
const parentBot = hitObject.parent;
if (parentBot && !parentBot.userData.isDead) {
const isHead = (hitObject.name === "head");
triggerHitEffect(intersects.point, isHead);
parentBot.userData.isDead = true;
removeBot(parentBot, isHead);
}
}
}
function createLaserTracer(direction) {
const material = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.8 });
const points = [];
const startPos = camera.position.clone().add(new THREE.Vector3(0, -0.2, 0));
const endPos = startPos.clone().add(direction.clone().multiplyScalar(40));
points.push(startPos);
points.push(endPos);
const geometry = new THREE.BufferGeometry().setFromPoints(points);
const line = new THREE.Line(geometry, material);
scene.add(line);
activeLasers.push({ mesh: line, spawnTime: performance.now(), duration: 60 });
}
function triggerHitEffect(hitPoint, isHead) {
hitNotifier.innerText = isHead ? "HEADSHOT!" : "BODY HIT";
hitNotifier.style.color = isHead ? "#ffeb3b" : "#ffffff";
hitNotifier.style.opacity = "1";
hitNotifier.style.transform = "translate(-50%, -50%) scale(1.3)";
setTimeout(() => {
hitNotifier.style.opacity = "0";
hitNotifier.style.transform = "translate(-50%, -50%) scale(1)";
}, 200);
const particleCount = isHead ? 20 : 8;
const color = isHead ? 0xffeb3b : 0x3b82f6;
for (let i = 0; i < particleCount; i++) {
const pGeo = new THREE.BoxGeometry(0.06, 0.06, 0.06);
const pMat = new THREE.MeshBasicMaterial({ color: color });
const p = new THREE.Mesh(pGeo, pMat);
p.position.copy(hitPoint);
p.userData = {
vx: (Math.random() - 0.5) * 6,
vy: (Math.random() * 4) + 2,
vz: (Math.random() - 0.5) * 6,
life: 1.0
};
scene.add(p);
particles.push(p);
}
}
function removeBot(botGroup, isHead) {
scene.remove(botGroup);
bots = bots.filter(b => b !== botGroup);
score += isHead ? 150 : 100;
document.getElementById('hud-score').innerText = 점수: ${score};
if(isPlaying) { spawnHumanoidBot(); }
}
function animate(timestamp) {
requestAnimationFrame(animate);
if (isPlaying) {
bots.forEach(bot => {
if (bot.userData.isDead) return;
const dir = new THREE.Vector3(0, bot.position.y, 0).sub(bot.position);
dir.y = 0; dir.normalize();
bot.position.add(dir.multiplyScalar(bot.userData.speed * 0.016));
const dist = bot.position.distanceTo(new THREE.Vector3(0, 0, 0));
if (dist < 1.8) {
hp -= 0.15;
if(hp < 0) hp = 0;
document.getElementById('hud-hp').innerText = 체력: ${Math.ceil(hp)};
if (hp <= 0) { endGame(); }
}
});
const now = performance.now();
for(let i = activeLasers.length - 1; i >= 0; i--) {
const laser = activeLasers[i];
if(now - laser.spawnTime > laser.duration) {
scene.remove(laser.mesh);
laser.mesh.geometry.dispose();
laser.mesh.material.dispose();
activeLasers.splice(i, 1);
}
}
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.position.x += p.userData.vx * 0.016;
p.position.y += p.userData.vy * 0.016;
p.position.z += p.userData.vz * 0.016;
p.userData.vy -= 9.8 * 0.016;
p.userData.life -= 0.04;
if (p.userData.life <= 0) {
scene.remove(p);
particles.splice(i, 1);
}
}
}
renderer.render(scene, camera);
}
function startGame() {
startScreen.classList.add('hidden');
gameoverScreen.classList.add('hidden');
isPlaying = true;
